{% extends "base.html" %}
{% block title %}Worker Login | AshaCare{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-user-nurse"></i>
                <h2>Worker Login</h2>
                <p>Login for ASHA / Anganwadi Workers</p>
            </div>

            <form method="POST">
                <div class="form-group">
                    <label for="username"><i class="fas fa-id-card"></i> Worker ID</label>
                    <input type="text" id="username" name="username" placeholder="Enter Worker ID" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <div class="auth-footer">
                <p><strong>Demo Login:</strong></p>
                <p>ASHA Worker → ID: <code>asha001</code> | Password: <code>123456</code></p>
                <p>Anganwadi → ID: <code>anganwadi01</code> | Password: <code>123456</code></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
